<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구스구스덕 추리 트래커 v5.2</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h1 {
            color: #f9e2af;
            margin: 0;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        .btn-group button {
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-reset-all { background-color: #f38ba8; color: #11111b; }
        .btn-reset-all:hover { background-color: #e67e9c; }
        .btn-reset-marker { background-color: #fab387; color: #11111b; }
        .btn-reset-marker:hover { background-color: #eba073; }
        .btn-corpse { background-color: #a6e3a1; color: #11111b; }
        .btn-corpse:hover { background-color: #94d08f; }
        .btn-map { background-color: #89b4fa; color: #11111b; }
        .btn-copy { background-color: #f5c2e7; color: #11111b; }
        .btn-copy:hover { background-color: #e5b0d5; }

        .main-container {
            display: flex;
            gap: 15px;
            flex: 1;
            overflow: hidden;
        }

        .table-container {
            flex: 1.3;
            overflow-y: auto;
            background-color: #313244;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 6px;
            text-align: center;
            border-bottom: 1px solid #45475a;
        }
        th {
            background-color: #11111b;
            color: #a6e3a1;
            position: sticky;
            top: 0;
            z-index: 10;
            font-size: 13px;
        }
        input[type="text"] {
            width: 90%;
            padding: 5px;
            border: 1px solid #45475a;
            border-radius: 4px;
            background-color: #1e1e2e;
            color: #cdd6f4;
            outline: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        input[type="text"]:focus {
            border: 1px solid #89b4fa;
        }
        select {
            padding: 5px;
            border-radius: 4px;
            border: none;
            background-color: #1e1e2e;
            color: white;
            cursor: pointer;
            width: 95%;
        }
        
        .role-select { font-weight: bold; }

        .role-goose { color: #ffffff !important; }
        .role-neutral { color: #f9e2af !important; }
        .role-duck { color: #f38ba8 !important; }
        
        option.opt-goose { color: #ffffff; background-color: #313244; }
        option.opt-neutral { color: #f9e2af; background-color: #313244;}
        option.opt-duck { color: #f38ba8; background-color: #313244;}
        option.opt-unknown { color: #cdd6f4; background-color: #313244;}

        .dead-row {
            opacity: 0.4;
            background-color: #4c1d1d !important;
        }
        .dead-row input[type="text"], .dead-row select {
            text-decoration: line-through;
            color: #f38ba8 !important;
        }

        .map-container {
            flex: 1.7;
            position: relative;
            background-color: #11111b;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #45475a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .map-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        #map-fallback {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .marker {
            position: absolute;
            padding: 4px 8px;
            background-color: #89b4fa;
            color: #11111b;
            font-weight: bold;
            font-size: 12px;
            border-radius: 20px;
            border: 2px solid #fff;
            cursor: grab;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            user-select: none;
            white-space: nowrap;
            z-index: 100;
            transition: background-color 0.3s, color 0.3s;
        }
        .marker:active { cursor: grabbing; z-index: 999; }
        
        .marker-goose { background-color: #ffffff !important; color: #11111b !important; }
        .marker-neutral { background-color: #f9e2af !important; color: #11111b !important; border-color: #d4a017; }
        .marker-duck { background-color: #f38ba8 !important; color: #ffffff !important; border-color: #8a1d3b; }

        .dead-marker {
            background-color: #45475a !important;
            color: #a6adc8 !important;
            text-decoration: line-through;
            border-color: #f38ba8 !important;
        }
        .corpse-marker {
            background-color: #f38ba8 !important;
            color: #11111b !important;
            font-size: 14px;
            border-radius: 5px;
            border: 2px solid #4c1d1d;
        }
        .corpse-close {
            margin-left: 5px;
            cursor: pointer;
            color: #11111b;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🦆 구스구스덕 16인 추리 트래커</h1>
        <div class="btn-group">
            <input type="file" id="map-upload" accept="image/*" style="display:none;" onchange="loadMapImage(event)">
            <button class="btn-map" onclick="document.getElementById('map-upload').click()">🗺️ 지도 변경</button>
            <button class="btn-corpse" onclick="addCorpse()">💀 시체 추가</button>
            <button class="btn-copy" id="btn-copy-brief" onclick="copyLocationBriefing()">📋 위치 결과 복사</button>
            <button class="btn-reset-marker" onclick="resetMarkersOnly()">📍 마커&위치 초기화</button>
            <button class="btn-reset-all" onclick="resetAll()">🔄 전체 초기화</button>
        </div>
    </div>

    <div class="main-container">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th width="5%">No.</th>
                        <th width="20%">닉네임</th>
                        <th width="12%">생존</th>
                        <th width="26%">직업 선택</th>
                        <th width="17%">위치</th>
                        <th width="20%">메모</th>
                    </tr>
                </thead>
                <tbody id="player-table">
                </tbody>
            </table>
        </div>

        <div class="map-container" id="map-area">
            <img src="image_0a04c3.jpg" id="map-image" alt="구스구스덕 맵" onerror="showMapFallback()">
            <div id="map-fallback" style="display: none;">
                <p style="color: #a6adc8; font-size: 18px;">지도를 자동으로 불러오지 못했습니다.</p>
                <button class="btn-group btn-map" style="padding: 10px 20px;" onclick="document.getElementById('map-upload').click()">
                    📁 폴더에서 지도 선택하기
                </button>
            </div>
        </div>
    </div>

    <script>
        // 직업 리스트
        const gooseRoles = ["거위 (Goose)", "한탕주의자 (Gravy)", "엔지니어 (Engineer) 🧭", "경호원 (Bodyguard)", "영매사 (Medium)", "자경단 (Vigilante)", "보안관 (Sheriff)", "캐나다 거위 (Canadian)", "흉내쟁이 (Mimic) 🧭", "탐정 (Detective)", "조류 관찰자 (Birdwatcher) 🧭", "장의사 (Mortician) 🧭", "정치가 (Politician) 🧭", "열쇠공 (Locksmith) 🧭", "연예인 (Celebrity)", "복수자 (Avenger)", "모험가 (Adventurer) 🧭", "차원 여행자 (Astral)", "부랑아 (Street Urchin) 🧭", "추적자 (Tracker) 🧭", "스토커 (Stalker)", "생존주의자 (Survivalist)", "로비스트 (Lobbyist)", "점쟁이 (Fortune Teller) 🧭", "과학자 (Scientist)", "센서 (Sensor) 🧭", "검시관 (Coroner)", "병사 (Soldier)", "루시드 드리머 (Lucid Dreamer)"];
        const duckRoles = ["오리 (Duck)", "식인종 (Cannibal) 🧭", "변장술사 (Morphling) 🧭", "군기반장 (Silencer)", "전문 업자 (Professional)", "청부업자 (Hitman)", "스파이 (Spy)", "암살자 (Assassin)", "밀고자 (Snitch) 🧭", "파티 오리 (Party) 🎤", "폭탄광 (Demolitionist)", "신분 도용범 (Identity Thief) 🧭", "시체 운반자 (Undertaker) 🧭", "닌자 (Ninja) 🧭", "투명 오리 (Invisibility)", "연쇄 살조범 (Serial Killer)", "주술사 (Warlock) 🧭", "초능력자 (Esper)", "전도사 (Preacher)", "드론 (Drone) 🧭", "큐피드 (Cupid) 🧭", "토끼 (Rabbit) 🧭", "마임 (Mime) 🧭", "광대 오리 (Clown)", "약탈자 (Looter) 🧭", "저격수 (Sniper) 🧭", "주술사 (Witch Doctor)", "숙주와 기생충 (Carrier&Parasite)", "길을 잃은 아기 오리 (Lost Duckling) 🧭"];
        const neutralRoles = ["도도새 (Dodo Bird)", "대머리수리 (Vulture) 🧭", "비둘기 (Pigeon)", "송골매 (Falcon)", "결투 도도새 (Dueling Dodos)", "펠리컨 (Pelican)", "매 (Hawk) 🧭", "큰까마귀 (Raven)", "뻐꾸기 (Cuckoo)"];

        // 위치 리스트 (T왼, 골동품 엿보기 추가됨)
        const locations = ["실험실", "보일러실", "안낀동", "독서실", "강당", "창고", "터널입구", "터널", "구덩이", "대기실", "희생의제단", "사물함", "골동품보관실", "던전", "T", "역T", "T오", "T왼", "강당엿보기", "골동품 엿보기", "실갑", "안낀동복도", "11시", "1시", "실험실 윗복도", "보일러실 윗복도", "독오", "독왼", "강당구맞추기"];

        let optionsHTML = '<option value="" class="opt-unknown">직업 미상</option>';
        optionsHTML += '<optgroup label="--- 거위 (시민) ---">';
        gooseRoles.forEach(r => optionsHTML += `<option value="🦆 ${r}" class="opt-goose">🦆 ${r}</option>`);
        optionsHTML += '</optgroup><optgroup label="--- 중립 ---">';
        neutralRoles.forEach(r => optionsHTML += `<option value="🦤 ${r}" class="opt-neutral">🦤 ${r}</option>`);
        optionsHTML += '</optgroup><optgroup label="--- 오리 (마피아) ---">';
        duckRoles.forEach(r => optionsHTML += `<option value="🔪 ${r}" class="opt-duck">🔪 ${r}</option>`);
        optionsHTML += '</optgroup>';

        let locOptionsHTML = '<option value="">- 위치 선택 -</option>';
        locations.forEach(loc => locOptionsHTML += `<option value="${loc}">${loc}</option>`);

        const tbody = document.getElementById('player-table');
        const mapArea = document.getElementById('map-area');

        for(let i = 1; i <= 16; i++) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i}</td>
                <td><input type="text" id="name-${i}" placeholder="닉네임"></td>
                <td>
                    <select id="status-${i}" onchange="updateStatus(${i})">
                        <option value="alive">🟢 생존</option>
                        <option value="dead">💀 사망</option>
                    </select>
                </td>
                <td>
                    <select id="role-${i}" class="role-select" onchange="updateRoleColor(${i})">
                        ${optionsHTML}
                    </select>
                </td>
                <td>
                    <select id="loc-${i}">
                        ${locOptionsHTML}
                    </select>
                </td>
                <td><input type="text" placeholder="메모"></td>
            `;
            tbody.appendChild(tr);

            const marker = document.createElement('div');
            marker.className = 'marker';
            marker.id = `marker-${i}`;
            marker.innerText = `${i}`;
            setMarkerInitialPosition(marker, i);
            mapArea.appendChild(marker);
            makeDraggable(marker);

            document.getElementById(`name-${i}`).addEventListener('input', (e) => {
                const name = e.target.value.trim();
                marker.innerText = name ? `${i}. ${name}` : `${i}`;
            });
        }
        
        function setMarkerInitialPosition(marker, i) {
            const col = (i - 1) % 8;
            const rowIdx = Math.floor((i - 1) / 8);
            marker.style.left = `${10 + (col * 50)}px`;
            marker.style.top = `${10 + (rowIdx * 35)}px`;
            marker.style.transform = 'none';
        }

        function updateRoleColor(id) {
            const roleSelect = document.getElementById(`role-${id}`);
            const marker = document.getElementById(`marker-${id}`);
            const val = roleSelect.value;
            roleSelect.classList.remove('role-goose', 'role-duck', 'role-neutral');
            marker.classList.remove('marker-goose', 'marker-duck', 'marker-neutral');
            if (val.includes("🦆")) {
                roleSelect.classList.add('role-goose');
                marker.classList.add('marker-goose');
            } else if (val.includes("🔪")) {
                roleSelect.classList.add('role-duck');
                marker.classList.add('marker-duck');
            } else if (val.includes("🦤")) {
                roleSelect.classList.add('role-neutral');
                marker.classList.add('marker-neutral');
            }
        }

        function updateStatus(id) {
            const select = document.getElementById(`status-${id}`);
            const row = select.parentElement.parentElement;
            const marker = document.getElementById(`marker-${id}`);
            if (select.value === 'dead') {
                row.classList.add('dead-row');
                marker.classList.add('dead-marker');
            } else {
                row.classList.remove('dead-row');
                marker.classList.remove('dead-marker');
            }
        }

        function showMapFallback() {
            document.getElementById('map-image').style.display = 'none';
            document.getElementById('map-fallback').style.display = 'flex';
        }

        function loadMapImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('map-image');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('map-fallback').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        function addCorpse() {
            const corpse = document.createElement('div');
            corpse.className = 'marker corpse-marker';
            corpse.innerHTML = `💀 시체 <span class="corpse-close" onclick="this.parentElement.remove()">X</span>`;
            corpse.style.left = '50%';
            corpse.style.top = '50%';
            corpse.style.transform = 'translate(-50%, -50%)';
            mapArea.appendChild(corpse);
            makeDraggable(corpse);
        }

        function copyLocationBriefing() {
            const locationMap = {};
            let hasData = false;

            for(let i = 1; i <= 16; i++) {
                const locSelect = document.getElementById(`loc-${i}`);
                const loc = locSelect.value;
                if(loc) {
                    const nameInput = document.getElementById(`name-${i}`).value.trim();
                    const nickname = nameInput ? nameInput : `${i}번`; 
                    
                    if(!locationMap[loc]) {
                        locationMap[loc] = [];
                    }
                    locationMap[loc].push(nickname);
                    hasData = true;
                }
            }

            if(!hasData) {
                alert("선택된 위치가 없습니다! 표에서 위치를 먼저 선택해주세요.");
                return;
            }

            let resultText = "";
            for(const loc in locationMap) {
                resultText += `${loc}: ${locationMap[loc].join(', ')}\n`;
            }

            navigator.clipboard.writeText(resultText.trim()).then(() => {
                const btn = document.getElementById('btn-copy-brief');
                const originalText = btn.innerText;
                btn.innerText = "✔️ 복사 완료!";
                btn.style.backgroundColor = "#a6e3a1"; 
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = ""; 
                }, 2000);
            }).catch(err => {
                alert(`복사에 실패했습니다.\\n\\n${resultText}`);
            });
        }

        function resetMarkersOnly() {
             if(confirm("마커 위치와 선택한 위치를 초기화하시겠습니까? (닉네임, 직업은 유지됩니다)")) {
                for(let i = 1; i <= 16; i++) {
                    const marker = document.getElementById(`marker-${i}`);
                    setMarkerInitialPosition(marker, i);
                    document.getElementById(`loc-${i}`).value = ""; 
                }
                document.querySelectorAll('.corpse-marker').forEach(el => el.remove());
             }
        }

        function resetAll() {
            if(confirm("모든 텍스트 내용과 마커 위치를 초기화하시겠습니까?")) {
                document.querySelectorAll('input[type="text"]').forEach(inp => inp.value = '');
                document.querySelectorAll('select').forEach(sel => {
                    if(sel.id.startsWith('status')) sel.value = 'alive';
                    else if(sel.id.startsWith('role')) {
                        sel.value = '';
                        sel.classList.remove('role-goose', 'role-duck', 'role-neutral');
                    }
                    else if(sel.id.startsWith('loc')) sel.value = '';
                });
                
                for(let i = 1; i <= 16; i++) {
                    const row = document.getElementById(`status-${i}`).parentElement.parentElement;
                    const marker = document.getElementById(`marker-${i}`);
                    
                    row.classList.remove('dead-row');
                    marker.className = 'marker'; 
                    marker.innerText = `${i}`;
                    
                    setMarkerInitialPosition(marker, i);
                }
                document.querySelectorAll('.corpse-marker').forEach(el => el.remove());
            }
        }

        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                if(e.target.className === 'corpse-close') return; 
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                elmnt.style.transform = 'none';
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }
    </script>
</body>
</html>
