<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구스구스덕 실시간 커뮤니티 트래커</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #1e1e2e; color: #cdd6f4; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; overflow: hidden; }
        
        /* 1. 로비 화면 디자인 (레이아웃 개편) */
        #lobby-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1e1e2e; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .lobby-box { background-color: #313244; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 900px; display: flex; gap: 30px; height: 500px; }
        .lobby-section { display: flex; flex-direction: column; }
        .lobby-section h2 { color: #f9e2af; margin-top: 0; border-bottom: 2px solid #45475a; padding-bottom: 10px; font-size: 18px; margin-bottom: 10px; }
        .lobby-input { width: 90%; padding: 10px; margin: 5px 0; border: 2px solid #45475a; border-radius: 8px; background-color: #1e1e2e; color: white; font-weight: bold; }
        .lobby-input:focus { border-color: #89b4fa; outline: none; }
        .lobby-btn { background-color: #a6e3a1; color: #11111b; padding: 10px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 5px; }
        .lobby-btn:hover { background-color: #94d08f; }
        #room-list-ui { background-color: #1e1e2e; flex: 1; border-radius: 8px; overflow-y: auto; padding: 10px; border: 2px solid #45475a; }
        .room-item { background-color: #45475a; padding: 10px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; font-weight: bold; transition: 0.2s; }
        .room-item:hover { background-color: #585b70; color: #a6e3a1; }

        /* 채팅 공통 스타일 */
        .chat-box-area { flex: 1; overflow-y: auto; background-color: #1e1e2e; padding: 10px; border-radius: 6px; font-size: 13px; display: flex; flex-direction: column; gap: 5px; border: 2px solid #45475a; }
        .chat-msg { background: #45475a; padding: 6px 10px; border-radius: 12px; width: fit-content; max-width: 90%; word-break: break-all; }
        .chat-system { color: #f9e2af; font-weight: bold; font-size: 12px; align-self: center; background: none; }

        /* 2. 메인 앱 화면 */
        #app-container { display: none; flex-direction: column; height: 100%; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { color: #f9e2af; margin: 0; font-size: 24px; }
        .room-info { background-color: #45475a; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        .btn-group button { padding: 8px 12px; margin-left: 5px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .btn-reset-all { background-color: #f38ba8; color: #11111b; } .btn-reset-marker { background-color: #fab387; color: #11111b; }
        .btn-corpse { background-color: #a6e3a1; color: #11111b; } .btn-map { background-color: #89b4fa; color: #11111b; } .btn-copy { background-color: #f5c2e7; color: #11111b; }

        .main-container { display: flex; gap: 15px; flex: 1; overflow: hidden; }
        
        .table-container { flex: 1.1; overflow-y: auto; background-color: #313244; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 4px; text-align: center; border-bottom: 1px solid #45475a; }
        th { background-color: #11111b; color: #a6e3a1; position: sticky; top: 0; z-index: 10; }
        input[type="text"] { width: 85%; padding: 4px; border: 1px solid #45475a; border-radius: 4px; background-color: #1e1e2e; color: #cdd6f4; font-weight: bold; }
        select { padding: 4px; border-radius: 4px; border: none; background-color: #1e1e2e; color: white; width: 95%; font-weight: bold; }
        .role-goose { color: #ffffff !important; } .role-neutral { color: #f9e2af !important; } .role-duck { color: #f38ba8 !important; }
        .dead-row { opacity: 0.4; background-color: #4c1d1d !important; } .dead-row input[type="text"], .dead-row select { text-decoration: line-through; color: #f38ba8 !important; }

        .map-container { flex: 1.4; position: relative; background-color: #11111b; border-radius: 10px; overflow: hidden; border: 2px solid #45475a; display: flex; align-items: center; justify-content: center; }
        .map-container img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        
        .side-panel { flex: 0.5; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
        .panel-box { background-color: #313244; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; overflow: hidden; }
        .panel-box h3 { margin: 0 0 10px 0; color: #89b4fa; font-size: 15px; border-bottom: 1px solid #45475a; padding-bottom: 5px; }
        
        #user-list-ui { list-style: none; padding: 0; margin: 0; overflow-y: auto; max-height: 100px; }
        #user-list-ui li { background: #45475a; padding: 5px 10px; border-radius: 5px; margin-bottom: 5px; font-weight: bold; font-size: 13px; display: flex; align-items: center; }
        .user-color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; border: 1px solid #fff; }
        
        #snapshot-list-ui { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        .snap-item { background: #45475a; padding: 8px; border-radius: 6px; margin-bottom: 5px; font-size: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .snap-item:hover { background: #89b4fa; color: #11111b; font-weight: bold; }

        .marker { position: absolute; padding: 4px 8px; background-color: #89b4fa; color: #11111b; font-weight: bold; font-size: 12px; border-radius: 20px; border: 2px solid #fff; cursor: grab; box-shadow: 0 2px 5px rgba(0,0,0,0.5); user-select: none; white-space: nowrap; z-index: 100; transition: background-color 0.3s, color 0.3s; }
        .marker:active { cursor: grabbing; z-index: 999; }
        .marker-goose { background-color: #ffffff !important; color: #11111b !important; } .marker-neutral { background-color: #f9e2af !important; color: #11111b !important; border-color: #d4a017; } .marker-duck { background-color: #f38ba8 !important; color: #ffffff !important; border-color: #8a1d3b; }
        .dead-marker { background-color: #45475a !important; color: #a6adc8 !important; text-decoration: line-through; border-color: #f38ba8 !important; }
        .corpse-marker { background-color: #f38ba8 !important; color: #11111b !important; font-size: 14px; border-radius: 5px; border: 2px solid #4c1d1d; }
        
        #snapshot-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; z-index: 500; }
        .return-btn { position: absolute; top: 10px; right: 10px; background-color: #f38ba8; color: white; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        .remote-cursor { position: absolute; pointer-events: none; z-index: 10000; opacity: 0.75; transition: left 0.05s linear, top 0.05s linear; display: flex; flex-direction: column; align-items: flex-start; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5)); }
        .cursor-name { margin-top: -5px; margin-left: 10px; padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; color: #11111b; white-space: nowrap; }
    </style>
</head>
<body>

    <!-- 1. 로비 화면 -->
    <div id="lobby-container">
        <div class="lobby-box">
            <!-- 1-1. 닉네임 설정 및 방 관리 -->
            <div class="lobby-section" style="flex: 1.2; border-right: 2px solid #45475a; padding-right: 20px;">
                <h2>👤 1. 닉네임 설정</h2>
                <input type="text" id="global-nickname" class="lobby-input" placeholder="사용할 닉네임 (입력 필수!)">
                
                <h2 style="margin-top: 15px;">✨ 2. 새 방 만들기</h2>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="create-room-name" class="lobby-input" style="flex:1;" placeholder="방 이름">
                    <input type="password" id="create-room-pw" class="lobby-input" style="flex:1;" placeholder="비밀번호">
                </div>
                <button class="lobby-btn" onclick="createRoom()">방 생성하기</button>

                <h2 style="margin-top: 15px;">🚪 3. 방 목록에서 입장</h2>
                <div id="room-list-ui"></div>
            </div>

            <!-- 1-2. 로비 전용 채팅 -->
            <div class="lobby-section" style="flex: 1; padding-left: 10px;">
                <h2>💬 로비 대기실 채팅</h2>
                <div id="lobby-chat-box" class="chat-box-area"></div>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <input type="text" id="lobby-chat-input" class="lobby-input" style="margin:0; flex:1;" placeholder="채팅 입력..." onkeypress="if(event.key==='Enter') sendLobbyChat()">
                    <button class="lobby-btn" style="margin:0; padding:10px;" onclick="sendLobbyChat()">전송</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. 메인 앱 화면 -->
    <div id="app-container">
        <div class="header">
            <div style="display:flex; align-items:center; gap:15px;">
                <h1>🦆 실시간 추리 트래커</h1>
                <div id="current-room-display" class="room-info">접속 중...</div>
            </div>
            <div class="btn-group">
                <input type="file" id="map-upload" accept="image/*" style="display:none;" onchange="loadMapImage(event)">
                <button class="btn-map" onclick="document.getElementById('map-upload').click()">🗺️ 지도 변경</button>
                <button class="btn-corpse" onclick="emitAddCorpse()">💀 시체 추가</button>
                <button class="btn-copy" id="btn-copy-brief" onclick="copyLocationBriefing()">📋 결과 복사</button>
                <button class="btn-reset-marker" onclick="emitResetMarkers()">📍 마커 초기화</button>
                <button class="btn-reset-all" onclick="emitResetAll()">🔄 전체 초기화</button>
            </div>
        </div>

        <div class="main-container">
            <div class="table-container">
                <table>
                    <thead><tr><th width="5%">No.</th><th width="22%">닉네임</th><th width="13%">생존</th><th width="25%">직업</th><th width="15%">위치</th><th width="20%">메모</th></tr></thead>
                    <tbody id="player-table"></tbody>
                </table>
            </div>

            <div class="map-container" id="map-area">
                <img src="image_0a04c3.jpg" id="map-image" alt="구스구스덕 맵">
                <div id="snapshot-layer">
                    <div class="return-btn" onclick="exitSnapshot()">❌ 과거 기록 닫기 (현재로 복귀)</div>
                    <div id="snapshot-markers-container"></div>
                </div>
            </div>
            
            <div class="side-panel">
                <div class="panel-box" style="flex: 0.3;">
                    <h3>👥 접속자 명단 (<span id="user-count">0</span>명)</h3>
                    <ul id="user-list-ui"></ul>
                </div>
                <div class="panel-box" style="flex: 0.4;">
                    <h3>💬 게임방 실시간 채팅</h3>
                    <div id="game-chat-box" class="chat-box-area"></div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        <input type="text" id="game-chat-input" placeholder="메시지 입력..." style="flex:1;" onkeypress="if(event.key==='Enter') sendGameChat()">
                        <button class="btn-map" onclick="sendGameChat()">전송</button>
                    </div>
                </div>
                <div class="panel-box" style="flex: 0.3;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3>📸 미니맵 기록</h3>
                        <button onclick="saveSnapshot()" class="btn-corpse" style="padding:4px 8px;">💾 현재 저장</button>
                    </div>
                    <ul id="snapshot-list-ui"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoom = "";
        let myName = "";
        const myColor = 'hsl(' + Math.floor(Math.random() * 360) + ', 80%, 70%)';
        let currentSnapshots = [];

        // ====== 로비 기능 ======
        socket.on('room_list', (list) => {
            const listUI = document.getElementById('room-list-ui');
            listUI.innerHTML = '';
            if(list.length === 0) {
                listUI.innerHTML = '<p style="text-align:center; color:#a6adc8; margin-top:30px;">생성된 방이 없습니다.</p>';
            } else {
                list.forEach(r => {
                    const el = document.createElement('div');
                    el.className = 'room-item';
                    el.innerHTML = `<span>📡 ${r.roomName}</span> <span>👤 ${r.userCount}명</span>`;
                    el.onclick = () => joinExistingRoom(r.roomName);
                    listUI.appendChild(el);
                });
            }
        });

        function getNickname() {
            const name = document.getElementById('global-nickname').value.trim();
            if(!name) alert("왼쪽 상단에서 [닉네임]을 먼저 설정해주세요!");
            return name;
        }

        function createRoom() {
            const nickname = getNickname();
            if(!nickname) return;
            const roomVal = document.getElementById('create-room-name').value.trim();
            const pwVal = document.getElementById('create-room-pw').value.trim();
            if(!roomVal || !pwVal) return alert("방 이름과 비밀번호를 모두 입력하세요!");
            socket.emit('create_room', { room: roomVal, password: pwVal });
        }

        socket.on('room_created', (roomName) => {
            alert(`[${roomName}] 방이 생성되었습니다! 목록에서 클릭하여 입장하세요.`);
            document.getElementById('create-room-name').value = '';
            document.getElementById('create-room-pw').value = '';
        });

        function joinExistingRoom(roomName) {
            const nickname = getNickname();
            if(!nickname) return;
            const password = prompt(`[${roomName}] 방 비밀번호를 입력하세요:`);
            if(password === null) return;
            myName = nickname;
            socket.emit('join_room', { room: roomName, nickname: nickname, password: password.trim(), color: myColor });
        }

        socket.on('room_error', (msg) => alert(msg));
        socket.on('join_success', (roomName) => {
            currentRoom = roomName;
            document.getElementById('lobby-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            document.getElementById('current-room-display').innerHTML = `<span style="display:inline-block; width:12px; height:12px; border-radius:50%; background-color:${myColor}; margin-right:5px; border:1px solid #fff;"></span> ${myName} (📡 ${roomName})`;
        });

        // ====== 로비 채팅 기능 ======
        function sendLobbyChat() {
            const nickname = getNickname();
            if(!nickname) return;
            const input = document.getElementById('lobby-chat-input');
            const msg = input.value.trim();
            if(!msg) return;
            socket.emit('send_lobby_chat', { sender: nickname, msg: msg, color: myColor });
            input.value = '';
        }

        socket.on('receive_lobby_chat', (data) => {
            const box = document.getElementById('lobby-chat-box');
            const el = document.createElement('div');
            el.className = 'chat-msg';
            el.innerHTML = `<b style="color:${data.color};">${data.sender}</b>: ${data.msg}`;
            box.appendChild(el);
            box.scrollTop = box.scrollHeight;
        });

        // ====== 실시간 마우스 커서 전송 ======
        let lastMouseTime = 0;
        document.addEventListener('mousemove', (e) => {
            if(currentRoom && Date.now() - lastMouseTime > 50) {
                const x = (e.pageX / window.innerWidth) * 100;
                const y = (e.pageY / window.innerHeight) * 100;
                socket.emit('mouse_move', { x, y });
                lastMouseTime = Date.now();
            }
        });

        socket.on('update_mouse', (data) => {
            let cursor = document.getElementById('cursor-' + data.id);
            if(!cursor) {
                cursor = document.createElement('div');
                cursor.id = 'cursor-' + data.id;
                cursor.className = 'remote-cursor';
                cursor.innerHTML = `
                    <svg width="20" height="25" viewBox="0 0 15 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 1L14 10L8 12L1 20V1Z" fill="${data.color}" stroke="white" stroke-width="1.5"/>
                    </svg>
                    <div class="cursor-name" style="background-color: ${data.color};">${data.nickname}</div>
                `;
                document.body.appendChild(cursor);
            }
            cursor.style.left = data.x + 'vw'; cursor.style.top = data.y + 'vh';
        });

        socket.on('remove_cursor', (id) => { const c = document.getElementById('cursor-' + id); if(c) c.remove(); });

        // ====== 사이드 패널 (명단, 방 채팅) ======
        socket.on('update_user_list', (users) => {
            document.getElementById('user-count').innerText = users.length;
            const ul = document.getElementById('user-list-ui');
            ul.innerHTML = '';
            users.forEach(u => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="user-color-dot" style="background-color:${u.color};"></span> ${u.nickname}`;
                ul.appendChild(li);
            });
        });

        function sendGameChat() {
            const input = document.getElementById('game-chat-input');
            const msg = input.value.trim();
            if(!msg) return;
            socket.emit('send_chat', { msg });
            input.value = '';
        }

        socket.on('receive_chat', (data) => {
            const box = document.getElementById('game-chat-box');
            const el = document.createElement('div');
            if(data.sender.includes('시스템')) {
                el.className = 'chat-msg chat-system'; el.style.color = data.color; el.innerText = data.msg;
            } else {
                el.className = 'chat-msg'; el.innerHTML = `<b style="color:${data.color};">${data.sender}</b>: ${data.msg}`;
            }
            box.appendChild(el);
            box.scrollTop = box.scrollHeight;
        });

        // ====== 스냅샷 (라운드 저장) ======
        function saveSnapshot() {
            const snapshotData = { markers: [], corpses: [] };
            for(let i = 1; i <= 16; i++) {
                const m = document.getElementById(`marker-${i}`);
                snapshotData.markers.push({ id: i, left: m.style.left, top: m.style.top, text: m.innerText, className: m.className });
            }
            document.querySelectorAll('.corpse-marker').forEach(c => { snapshotData.corpses.push({ left: c.style.left, top: c.style.top }); });
            socket.emit('save_snapshot', { snapshotData });
        }

        socket.on('update_snapshots', (snapshots) => {
            currentSnapshots = snapshots;
            const ul = document.getElementById('snapshot-list-ui');
            ul.innerHTML = '';
            snapshots.forEach((snap, idx) => {
                const li = document.createElement('li'); li.className = 'snap-item';
                li.innerHTML = `<span>${snap.name}</span> <span>🔍보기</span>`;
                li.onclick = () => viewSnapshot(idx);
                ul.appendChild(li);
            });
        });

        function viewSnapshot(idx) {
            const snap = currentSnapshots[idx];
            const layer = document.getElementById('snapshot-layer');
            const container = document.getElementById('snapshot-markers-container');
            container.innerHTML = ''; 
            snap.data.markers.forEach(m => {
                const el = document.createElement('div'); el.className = m.className;
                el.style.left = m.left; el.style.top = m.top; el.innerText = m.text; el.style.position = 'absolute'; el.style.zIndex = '600';
                container.appendChild(el);
            });
            snap.data.corpses.forEach(c => {
                const el = document.createElement('div'); el.className = 'marker corpse-marker'; el.innerHTML = '💀 시체';
                el.style.left = c.left; el.style.top = c.top; el.style.transform = 'translate(-50%, -50%)'; el.style.position = 'absolute'; el.style.zIndex = '600';
                container.appendChild(el);
            });
            layer.style.display = 'block';
        }
        function exitSnapshot() { document.getElementById('snapshot-layer').style.display = 'none'; }

        // ====== 테이블 및 맵 로직 ======
        const gooseRoles = ["거위 (Goose)", "한탕주의자 (Gravy)", "엔지니어 (Engineer) 🧭", "경호원 (Bodyguard)", "영매사 (Medium)", "자경단 (Vigilante)", "보안관 (Sheriff)", "캐나다 거위 (Canadian)", "흉내쟁이 (Mimic) 🧭", "탐정 (Detective)", "조류 관찰자 (Birdwatcher) 🧭", "장의사 (Mortician) 🧭", "정치가 (Politician) 🧭", "열쇠공 (Locksmith) 🧭", "연예인 (Celebrity)", "복수자 (Avenger)", "모험가 (Adventurer) 🧭", "차원 여행자 (Astral)", "부랑아 (Street Urchin) 🧭", "추적자 (Tracker) 🧭", "스토커 (Stalker)", "생존주의자 (Survivalist)", "로비스트 (Lobbyist)", "점쟁이 (Fortune Teller) 🧭", "과학자 (Scientist)", "센서 (Sensor) 🧭", "검시관 (Coroner)", "병사 (Soldier)", "루시드 드리머 (Lucid Dreamer)"];
        const duckRoles = ["오리 (Duck)", "식인종 (Cannibal) 🧭", "변장술사 (Morphling) 🧭", "군기반장 (Silencer)", "전문 업자 (Professional)", "청부업자 (Hitman)", "스파이 (Spy)", "암살자 (Assassin)", "밀고자 (Snitch) 🧭", "파티 오리 (Party) 🎤", "폭탄광 (Demolitionist)", "신분 도용범 (Identity Thief) 🧭", "시체 운반자 (Undertaker) 🧭", "닌자 (Ninja) 🧭", "투명 오리 (Invisibility)", "연쇄 살조범 (Serial Killer)", "주술사 (Warlock) 🧭", "초능력자 (Esper)", "전도사 (Preacher)", "드론 (Drone) 🧭", "큐피드 (Cupid) 🧭", "토끼 (Rabbit) 🧭", "마임 (Mime) 🧭", "광대 오리 (Clown)", "약탈자 (Looter) 🧭", "저격수 (Sniper) 🧭", "주술사 (Witch Doctor)", "숙주와 기생충 (Carrier&Parasite)", "길을 잃은 아기 오리 (Lost Duckling) 🧭"];
        const neutralRoles = ["도도새 (Dodo Bird)", "대머리수리 (Vulture) 🧭", "비둘기 (Pigeon)", "송골매 (Falcon)", "결투 도도새 (Dueling Dodos)", "펠리컨 (Pelican)", "매 (Hawk) 🧭", "큰까마귀 (Raven)", "뻐꾸기 (Cuckoo)"];
        const locations = ["실험실", "보일러실", "안낀동", "독서실", "강당", "창고", "터널입구", "터널", "구덩이", "대기실", "희생의제단", "사물함", "골동품보관실", "던전", "T", "역T", "T오", "T왼", "강당엿보기", "골동품 엿보기", "실갑", "안낀동복도", "11시", "1시", "실험실 윗복도", "보일러실 윗복도", "독오", "독왼", "강당구맞추기"];

        let optionsHTML = '<option value="" class="opt-unknown">직업 미상</option>';
        optionsHTML += '<optgroup label="--- 거위 (시민) ---">'; gooseRoles.forEach(r => optionsHTML += `<option value="🦆 ${r}" class="opt-goose">🦆 ${r}</option>`);
        optionsHTML += '</optgroup><optgroup label="--- 중립 ---">'; neutralRoles.forEach(r => optionsHTML += `<option value="🦤 ${r}" class="opt-neutral">🦤 ${r}</option>`);
        optionsHTML += '</optgroup><optgroup label="--- 오리 (마피아) ---">'; duckRoles.forEach(r => optionsHTML += `<option value="🔪 ${r}" class="opt-duck">🔪 ${r}</option>`); optionsHTML += '</optgroup>';

        let locOptionsHTML = '<option value="">- 위치 선택 -</option>';
        locations.forEach(loc => locOptionsHTML += `<option value="${loc}">${loc}</option>`);

        const tbody = document.getElementById('player-table');
        const mapArea = document.getElementById('map-area');

        for(let i = 1; i <= 16; i++) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i}</td>
                <td><input type="text" id="name-${i}" placeholder="닉네임" oninput="emitInput('name', ${i}, this.value)"></td>
                <td><select id="status-${i}" onchange="emitInput('status', ${i}, this.value); updateStatus(${i})"><option value="alive">🟢 생존</option><option value="dead">💀 사망</option></select></td>
                <td><select id="role-${i}" class="role-select" onchange="emitInput('role', ${i}, this.value); updateRoleColor(${i})">${optionsHTML}</select></td>
                <td><select id="loc-${i}" onchange="emitInput('loc', ${i}, this.value)">${locOptionsHTML}</select></td>
                <td><input type="text" id="memo-${i}" placeholder="메모" oninput="emitInput('memo', ${i}, this.value)"></td>
            `;
            tbody.appendChild(tr);

            const marker = document.createElement('div');
            marker.className = 'marker'; marker.id = `marker-${i}`; marker.innerText = `${i}`;
            setMarkerInitialPosition(marker, i);
            mapArea.appendChild(marker);
            makeDraggable(marker);
        }
        
        function setMarkerInitialPosition(marker, i) {
            const col = (i - 1) % 8; const rowIdx = Math.floor((i - 1) / 8);
            marker.style.left = `${10 + (col * 50)}px`; marker.style.top = `${10 + (rowIdx * 35)}px`; marker.style.transform = 'none';
        }

        function emitInput(field, id, value) {
            if(currentRoom) {
                socket.emit('update_input', { room: currentRoom, field, id, value });
                if(field === 'name') document.getElementById(`marker-${id}`).innerText = value.trim() ? `${id}. ${value.trim()}` : `${id}`;
            }
        }
        function emitAddCorpse() { const corpseId = 'corpse-' + Date.now(); addCorpseUI(corpseId, '50%', '50%'); if(currentRoom) socket.emit('add_corpse', { room: currentRoom, corpseId, left: '50%', top: '50%' }); }
        function emitRemoveCorpse(corpseId) { document.getElementById(corpseId).remove(); if(currentRoom) socket.emit('remove_corpse', { room: currentRoom, corpseId }); }
        function emitResetMarkers() { if(confirm("마커와 위치를 모두 초기화하시겠습니까?")) { resetMarkersOnlyUI(); if(currentRoom) socket.emit('reset_markers'); } }
        function emitResetAll() { if(confirm("모든 내용을 초기화하시겠습니까?")) { resetAllUI(); if(currentRoom) socket.emit('reset_all'); } }

        socket.on('receive_input', (data) => {
            const el = document.getElementById(`${data.field}-${data.id}`);
            if(el) {
                el.value = data.value;
                if(data.field === 'name') document.getElementById(`marker-${data.id}`).innerText = data.value.trim() ? `${data.id}. ${data.value.trim()}` : `${data.id}`;
                if(data.field === 'role') updateRoleColor(data.id);
                if(data.field === 'status') updateStatus(data.id);
            }
        });
        
        socket.on('receive_add_corpse', (data) => addCorpseUI(data.corpseId, data.left, data.top));
        socket.on('receive_remove_corpse', (data) => { const c = document.getElementById(data.corpseId); if(c) c.remove(); });
        socket.on('receive_reset_markers', () => resetMarkersOnlyUI());
        socket.on('receive_reset_all', () => resetAllUI());

        function updateRoleColor(id) {
            const roleSelect = document.getElementById(`role-${id}`); const marker = document.getElementById(`marker-${id}`); const val = roleSelect.value;
            roleSelect.classList.remove('role-goose', 'role-duck', 'role-neutral'); marker.classList.remove('marker-goose', 'marker-duck', 'marker-neutral');
            if (val.includes("🦆")) { roleSelect.classList.add('role-goose'); marker.classList.add('marker-goose'); }
            else if (val.includes("🔪")) { roleSelect.classList.add('role-duck'); marker.classList.add('marker-duck'); }
            else if (val.includes("🦤")) { roleSelect.classList.add('role-neutral'); marker.classList.add('marker-neutral'); }
        }
        function updateStatus(id) {
            const select = document.getElementById(`status-${id}`); const row = select.parentElement.parentElement; const marker = document.getElementById(`marker-${id}`);
            if (select.value === 'dead') { row.classList.add('dead-row'); marker.classList.add('dead-marker'); } else { row.classList.remove('dead-row'); marker.classList.remove('dead-marker'); }
        }
        function addCorpseUI(id, left, top) {
            const corpse = document.createElement('div'); corpse.className = 'marker corpse-marker'; corpse.id = id;
            corpse.innerHTML = `💀 시체 <span class="corpse-close" onclick="emitRemoveCorpse('${id}')">X</span>`;
            corpse.style.left = left; corpse.style.top = top; corpse.style.transform = 'translate(-50%, -50%)';
            mapArea.appendChild(corpse); makeDraggable(corpse);
        }
        function resetMarkersOnlyUI() {
            for(let i = 1; i <= 16; i++) { setMarkerInitialPosition(document.getElementById(`marker-${i}`), i); document.getElementById(`loc-${i}`).value = ""; }
            document.querySelectorAll('.corpse-marker').forEach(el => el.remove());
        }
        function resetAllUI() {
            document.querySelectorAll('input[type="text"]').forEach(inp => { if(!inp.classList.contains('lobby-input')) inp.value = ''; });
            document.querySelectorAll('select').forEach(sel => {
                if(sel.id.startsWith('status')) sel.value = 'alive'; else if(sel.id.startsWith('role')) { sel.value = ''; sel.classList.remove('role-goose', 'role-duck', 'role-neutral'); } else if(sel.id.startsWith('loc')) sel.value = '';
            });
            for(let i = 1; i <= 16; i++) {
                const row = document.getElementById(`status-${i}`).parentElement.parentElement; const marker = document.getElementById(`marker-${i}`);
                row.classList.remove('dead-row'); marker.className = 'marker'; marker.innerText = `${i}`; setMarkerInitialPosition(marker, i);
            }
            document.querySelectorAll('.corpse-marker').forEach(el => el.remove());
        }
        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            elmnt.onmousedown = dragMouseDown;
            function dragMouseDown(e) {
                if(e.target.className === 'corpse-close') return; e = e || window.event; e.preventDefault(); pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = closeDragElement; document.onmousemove = elementDrag; elmnt.style.transform = 'none';
            }
            function elementDrag(e) {
                e = e || window.event; e.preventDefault(); pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY; pos3 = e.clientX; pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px"; elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                if(currentRoom) socket.emit('move_marker', { room: currentRoom, markerId: elmnt.id, top: elmnt.style.top, left: elmnt.style.left });
            }
            function closeDragElement() { document.onmouseup = null; document.onmousemove = null; }
        }
        function copyLocationBriefing() {
            const locationMap = {}; let hasData = false;
            for(let i = 1; i <= 16; i++) {
                const loc = document.getElementById(`loc-${i}`).value;
                if(loc) { const nickname = document.getElementById(`name-${i}`).value.trim() || `${i}번`; if(!locationMap[loc]) locationMap[loc] = []; locationMap[loc].push(nickname); hasData = true; }
            }
            if(!hasData) return alert("선택된 위치가 없습니다!");
            let resultText = ""; for(const loc in locationMap) resultText += `${loc}: ${locationMap[loc].join(', ')}\n`;
            navigator.clipboard.writeText(resultText.trim()).then(() => {
                const btn = document.getElementById('btn-copy-brief'); const originalText = btn.innerText; btn.innerText = "✔️ 복사 완료!"; btn.style.backgroundColor = "#a6e3a1"; 
                setTimeout(() => { btn.innerText = originalText; btn.style.backgroundColor = ""; }, 2000);
            }).catch(err => alert(`복사에 실패했습니다.\n\n${resultText}`));
        }
        function loadMapImage(event) {
            const file = event.target.files[0];
            if (file) { const reader = new FileReader(); reader.onload = function(e) { document.getElementById('map-image').src = e.target.result; }; reader.readAsDataURL(file); }
        }
    </script>
</body>
</html>
